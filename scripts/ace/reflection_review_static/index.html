<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Playbook Rule Review</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">R<span>↔</span></span><div><strong id="brand-title">Content Review</strong><span class="eyebrow">HUMAN DETAIL COMPARISON</span></div></div>
    <div class="top-actions"><span id="global-progress">불러오는 중…</span><a class="download" href="/api/export.csv">결과 CSV ↓</a></div>
  </header>
  <main>
    <div class="intro"><div><span class="eyebrow">A SIDE-BY-SIDE READING</span><h1 id="review-question">비교 내용을 불러오는 중…</h1><p id="review-instructions">선택하면 자동 저장하고 다음 쌍으로 이동합니다.</p></div><span class="blind-badge">◈ Blind comparison</span></div>
    <section class="filters" aria-label="평가 조건 선택">
      <label>모델<select id="model" aria-label="모델"></select></label>
      <label>추론 모드<select id="mode" aria-label="추론 모드"></select></label>
      <label>GT 설정<select id="arm" aria-label="GT 설정"></select></label>
      <label>선정 seed<select id="seed" aria-label="선정 seed"></select></label>
    </section>
    <section class="progress-section" aria-label="평가 진행률">
      <div class="progress-copy"><strong id="scope-progress">—</strong><span id="scope-caption">조건별 평가 진행률</span></div>
      <div class="progress-track"><div id="progress-fill"></div></div>
    </section>
    <div id="message" role="status" aria-live="polite"></div>
    <section id="comparison" hidden>
      <div class="pair-meta"><div><span id="pair-position"></span><span class="dot">·</span><span id="task-id"></span><span class="dot">·</span><span id="pair-seed"></span><span id="rated-badge" class="rated-badge" hidden>저장된 평가</span></div><div class="navigation"><button id="previous" class="quiet" title="이전 쌍">← 이전</button><button id="next" class="quiet" title="평가하지 않은 다음 쌍">다음 미평가 →</button></div></div>
      <details class="task"><summary>Task 내용 보기</summary><div id="task-text"></div></details>
      <div class="cards">
        <article class="reflection-card" id="card-left"><div class="card-top"><span class="letter">A</span><h2 id="left-title">A</h2><span class="rule-count" id="left-rule-count" hidden></span><span class="choice-tag" hidden>내 선택</span></div><div class="reflection-text" id="left-text" tabindex="0"></div><div class="card-bottom"><button class="choose" data-choice="left">A가 더 디테일함 <kbd>1</kbd></button></div></article>
        <article class="reflection-card" id="card-right"><div class="card-top"><span class="letter">B</span><h2 id="right-title">B</h2><span class="rule-count" id="right-rule-count" hidden></span><span class="choice-tag" hidden>내 선택</span></div><div class="reflection-text" id="right-text" tabindex="0"></div><div class="card-bottom"><button class="choose" data-choice="right">B가 더 디테일함 <kbd>2</kbd></button></div></article>
      </div>
      <div class="decision-tools"><label class="note-label">메모 <span>선택 사항</span><input id="note" maxlength="2000" placeholder="구체적인 절차, 예외 조건 등 판단 근거를 남길 수 있어요."></label><button class="tie" data-choice="tie">상세함이 비슷함 <kbd>0</kbd></button></div>
      <p class="footnote">A/B 배치는 무작위로 정해지며 다시 접속해도 유지됩니다. 이전 평가를 열어 선택을 수정할 수 있어요.</p>
    </section>
    <section id="empty" class="empty" hidden><span class="empty-mark">✓</span><h2 id="empty-title"></h2><p id="empty-copy"></p><button id="review-again" class="quiet">저장한 평가 다시 보기</button></section>
    <footer><span id="review-footer">ACE · AppWorld</span><span id="save-status" aria-live="polite">선택 결과는 서버에 저장됩니다.</span></footer>
  </main>
</body>
</html>
